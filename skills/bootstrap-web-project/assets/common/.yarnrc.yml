nodeLinker: node-modules

enableGlobalCache: true

npmMinimalAgeGate: 1440

# Upstream @commitlint/load uses the TypeScript cosmiconfig loader without
# declaring the loader's peers. Keep this explicit until upstream fixes it.
packageExtensions:
  "@commitlint/load@*":
    dependencies:
      "@types/node": "24.13.3"
      typescript: "5.9.3"
  # fastify-type-provider-zod declares its optional OpenAPI integrations as
  # required peers. Keep this explicit until upstream marks them optional.
  fastify-type-provider-zod@*:
    peerDependenciesMeta:
      "@fastify/swagger":
        optional: true
      openapi-types:
        optional: true

