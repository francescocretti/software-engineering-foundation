# Supabase CLI configuration. Sections omitted here use the CLI defaults.
project_id = "{{PROJECT_NAME}}"

[api]
enabled = true
port = 54321
# Only schemas listed here are reachable through the Data API.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Bounds accidental or abusive unbounded reads.
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = false

[analytics]
enabled = false
